export_root: "res://addons/sweet_ui/_export_ignore/exports"
plugin_folder: "SweetUI{{version=res://addons/sweet_ui}}"
pre_script: ""
post_script: ""
test_require: 
  - @require
options:
  overwrite: true
  include_uid: true
  include_import: true
  ignore_src: false
  use_tag_in_cfg: true
  include_min_version: true
  move_global_files: false
  include_docs: true
  include_project_license: false
  parser_settings:
    use_relative_paths: false
    backport_target: 100
    parse_cs:
      namespace_rename: {}
    parse_gd:
      replace_editor_interface: false
      optimizer:
        struct_mode: tagged
        inline_mode: tagged
        aggressive: false
        debug_tags: false
        enabled: true
      class_rename_ignore: ["_SweetUIGenerator"]
      backport_string_renames: {}
    parse_tscn: {}
    parse_tres: {}
exports:
  -
    source: "res://addons/sweet_ui"
    export_name: "sweet-ui{{version=res://addons/sweet_ui}}"
    export_folder: addons/sweet_ui
    exclude:
      directories:
        - "res://addons/sweet_ui/_export_ignore"
      file_extensions: []
      files: []
    other_transfers:
      - from: res://addons/sweet_ui/src/generator/templates/
        to: src/generator/templates/
        recursive: true
        ignore_deps: true
    parser_overide_settings:
      parse_cs: {}
      parse_gd: {}
      parse_tscn: {}
      parse_tres: {}
    remote_dir: "res://addons/sweet_ui/src/remote"
